<!doctype html>
<html lang="nl" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Forge Systeem — bouw met een team van helpers op je eigen pc." />
    <link rel="icon" type="image/svg+xml" href="./assets/forge-mark-favicon-CcEF0GhG.svg" />
    <title>Forge Systeem</title>
    <script>
      // Applied before first paint so the shell never flashes the wrong theme. Light is the default;
      // "system" (Zoals Windows) follows Windows, so a Windows set to dark still opens dark.
      (function () {
        var resolved = 'light';
        try {
          var stored = localStorage.getItem('forge.prototype.appearance');
          var mode = stored === 'light' || stored === 'dark' || stored === 'system' ? stored : 'system';
          resolved =
            mode === 'system'
              ? window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
              : mode;
        } catch (e) {
          resolved = 'light';
        }
        document.documentElement.setAttribute('data-theme', resolved);
      })();
    </script>
